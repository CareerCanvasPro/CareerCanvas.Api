              Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:layer:prisma:5
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                - !Sub "arn:aws:s3:::${S3Bucket}/*"
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref UsersApi
            Path: /user
            Method: get
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          PRISMA_QUERY_ENGINE_LIBRARY: /opt/nodejs/node_modules/.prisma/client/libquery_engine-linux-arm64-openssl-3.0.x.so.node
          REGION: !Ref AWS::Region
          S3_BUCKET: !Ref S3Bucket
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Bundle: true
        External:
          - "@aws-sdk/client-s3"
          - "@aws-sdk/s3-request-presigner"
        KeepNames: false
